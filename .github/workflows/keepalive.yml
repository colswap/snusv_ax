# 퍼블릭 레포는 60일간 활동이 없으면 스케줄 워크플로가 자동 비활성화된다.
# 타이머를 리셋하는 것은 커밋뿐이며 이슈·PR·릴리스는 인정되지 않는다.
# 방학처럼 커밋이 끊기는 기간에 리마인더가 조용히 멈추는 것을 막는다.
name: keepalive

on:
  schedule:
    - cron: "0 3 1 * *" # 매월 1일 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 활동 기록 갱신
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive (스케줄 워크플로 60일 비활성화 방지)"
          git push
