name: 회계 송금 리마인더

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST.
    # 참고: 00:00 UTC는 GitHub Actions cron이 가장 몰리는 시각이라 실행이
    # 십수 분 늦어질 수 있다. 지연이 거슬리면 "50 23 * * *"(08:50 KST)로 옮긴다.
    # 한산한 시각이라 9시 전에 안정적으로 돈다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DM을 보내지 않고 판정 결과만 출력"
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 리마인더 실행
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FINANCE_CHANNEL_ID: ${{ vars.FINANCE_CHANNEL_ID }}
          ACCOUNTANT_USERGROUP: ${{ vars.ACCOUNTANT_USERGROUP }}
          COHORT_START_DATE: ${{ vars.COHORT_START_DATE }}
          REMIND_AFTER_HOURS: ${{ vars.REMIND_AFTER_HOURS }}
          DONE_EMOJI: ${{ vars.DONE_EMOJI }}
          SKIP_EMOJI: ${{ vars.SKIP_EMOJI }}
        run: |
          python -m automations.finance_reminder.main \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
